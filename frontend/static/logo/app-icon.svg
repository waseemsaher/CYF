<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- تدرج الخلفية الفاخر الداكن -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- تدرج القوس الأيسر (حرف C والـ Bracket) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- تدرج الشريحة التقنية وحرف E -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- تدرج إطار الحماية الخارجي -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.05"/>
    </linearGradient>

    <!-- توهج خفيف للعمق التقني -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- خلفية الأيقونة (مربعة بحواف دائرية عصرية - Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- الكتلة الأيقونية المركزية (High Contrast Glyph) -->
  <g transform="translate(10, 0)">
    <!-- القوس الأيسر: يرمز لرمز الكود '<' وشكل الـ 'C' لـ Code -->
    <path d="M 230 138 
             L 140 228 
             A 40 40 0 0 0 140 284 
             L 230 374 
             A 22 22 0 0 0 262 342 
             L 186 266 
             A 14 14 0 0 1 186 246 
             L 262 170 
             A 22 22 0 0 0 230 138 Z" 
          fill="url(#primaryGrad)"/>

    <!-- الجزء الأيمن: الشرائح الثلاث لحرف 'E' ومؤشر التيرمينال التقني -->
    <!-- الشريحة العلوية -->
    <rect x="276" y="148" width="108" height="38" rx="19" fill="url(#accentGrad)"/>

    <!-- الشريحة الوسطى (أقصر لتشكيل E هندسية واضحة) -->
    <rect x="276" y="237" width="84" height="38" rx="19" fill="#38BDF8"/>

    <!-- الشريحة السفلية -->
    <rect x="276" y="326" width="108" height="38" rx="19" fill="url(#primaryGrad)"/>

    <!-- نقطة الـ Prompt التفاعلية (Accent Dot) -->
    <circle cx="396" cy="256" r="14" fill="#00F5D4" filter="url(#glow)"/>
  </g>
</svg>
