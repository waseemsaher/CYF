version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: cyf-prod-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/api-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - cyf-storage-data:/var/www/html/storage/app:ro
    depends_on:
      - backend
    networks:
      - cyf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cyf-backend:prod
    container_name: cyf-prod-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - cyf-storage-data:/var/www/html/storage/app
      - ./deploy/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cyf}
      DB_USERNAME: ${DB_USERNAME:-cyf}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      - mysql
      - redis
    networks:
      - cyf-network

  queue-worker:
    image: cyf-backend:prod
    container_name: cyf-prod-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - cyf-storage-data:/var/www/html/storage/app
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
    depends_on:
      - backend
      - redis
    networks:
      - cyf-network

  scheduler:
    image: cyf-backend:prod
    container_name: cyf-prod-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - backend
      - redis
    networks:
      - cyf-network

  mysql:
    image: mysql:8.4
    container_name: cyf-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cyf}
      MYSQL_USER: ${DB_USERNAME:-cyf}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-prod-data:/var/lib/mysql
    networks:
      - cyf-network

  redis:
    image: redis:7-alpine
    container_name: cyf-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-prod-data:/data
    networks:
      - cyf-network

networks:
  cyf-network:
    driver: bridge

volumes:
  mysql-prod-data:
  redis-prod-data:
  cyf-storage-data:
