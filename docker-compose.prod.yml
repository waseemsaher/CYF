# ==============================================================================
# Production Docker Compose Configuration for Codeera Backend
# Provider-Agnostic: Runs on AWS EC2 or Oracle Cloud Always Free
# ==============================================================================

services:
  web:
    image: caddy:2-alpine
    container_name: cyf-prod-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-api.codeera.tech}
      ACME_EMAIL: ${ACME_EMAIL:-admin@codeera.tech}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/public:/var/www/html/public:ro
      - cyf_storage_data:/var/www/html/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cyf-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ghcr.io/waseemsaher/cyf-app:latest}
    container_name: cyf-prod-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cyf}
      DB_USERNAME: ${DB_USERNAME:-cyf_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-codeera-media}
      AWS_BACKUP_BUCKET: ${AWS_BACKUP_BUCKET:-codeera-backups}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
    volumes:
      - cyf_storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyf-network
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  queue:
    image: cyf-backend:prod
    container_name: cyf-prod-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--max-time=3600", "--timeout=90"]
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cyf}
      DB_USERNAME: ${DB_USERNAME:-cyf_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-codeera-media}
      AWS_BACKUP_BUCKET: ${AWS_BACKUP_BUCKET:-codeera-backups}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
    volumes:
      - cyf_storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - cyf-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    image: ${APP_IMAGE:-ghcr.io/waseemsaher/cyf-app:latest}
    container_name: cyf-prod-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cyf}
      DB_USERNAME: ${DB_USERNAME:-cyf_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-codeera-media}
      AWS_BACKUP_BUCKET: ${AWS_BACKUP_BUCKET:-codeera-backups}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
    volumes:
      - cyf_storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - cyf-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: cyf-prod-mysql
    restart: unless-stopped
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-file-size=32M
      - --max-connections=40
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-cyf}
      MYSQL_USER: ${DB_USERNAME:-cyf_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cyf_mysql_data:/var/lib/mysql
    networks:
      - cyf-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cyf-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    volumes:
      - cyf_redis_data:/data
    networks:
      - cyf-network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: cyf-test-minio
    profiles: ["test", "drill"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - cyf_minio_data:/data
    networks:
      - cyf-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio-init:
    image: ${APP_IMAGE:-ghcr.io/waseemsaher/cyf-app:latest}
    container_name: cyf-minio-init
    profiles: ["test", "drill"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - cyf-network
    entrypoint: >
      php -r '
      require "/var/www/html/vendor/autoload.php";
      $$s3 = new Aws\S3\S3Client([
          "version" => "latest",
          "region" => "us-east-1",
          "endpoint" => "http://minio:9000",
          "use_path_style_endpoint" => true,
          "credentials" => ["key" => "minioadmin", "secret" => "minioadminpassword"]
      ]);
      foreach (["codeera-media", "codeera-backups"] as $$b) {
          try { $$s3->createBucket(["Bucket" => $$b]); } catch (\Exception $$e) {}
      }
      '

networks:
  cyf-network:
    driver: bridge

volumes:
  cyf_mysql_data:
  cyf_redis_data:
  cyf_storage_data:
  cyf_minio_data:
  caddy_data:
  caddy_config:
