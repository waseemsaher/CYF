[PHP]
memory_limit = 128M
upload_max_filesize = 55M
post_max_size = 55M
max_execution_time = 30
max_input_time = 30
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = UTC

; Security Hardening & Zero-Downtime RCE Mitigation (PHP2Shell / CVE-2026-109618, CVE-2026-109619)
session.upload_progress.enabled = 0

