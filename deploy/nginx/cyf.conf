# Production Nginx Configuration for Al-Azhar FCAI Course Platform
# Place this file in /etc/nginx/sites-available/cyf and symlink to /etc/nginx/sites-enabled/

upstream sveltekit_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream php_backend {
    server unix:/run/php/php8.3-fpm.sock;
    keepalive 16;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name courses.fcai-azhar.edu.eg;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Primary Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name courses.fcai-azhar.edu.eg;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/courses.fcai-azhar.edu.eg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.fcai-azhar.edu.eg/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (uncomment after initial testing)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 55MB Upload limit (for 50MB lecture files + payment proof images)
    client_max_body_size 55M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/cyf_access.log;
    error_log /var/log/nginx/cyf_error.log warn;

    # -------------------------------------------------------------
    # SvelteKit Static Immutable Assets (Direct File Serve)
    # -------------------------------------------------------------
    location /_app/immutable/ {
        alias /var/www/cyf/frontend/build/client/_app/immutable/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static assets (favicons, robots.txt)
    location ~* \.(ico|png|jpg|jpeg|svg|webp|woff2?|ttf|eot)$ {
        root /var/www/cyf/frontend/build/client;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @sveltekit;
    }

    # -------------------------------------------------------------
    # Laravel API & Health Check Endpoint
    # -------------------------------------------------------------
    location ~ ^/(api|up|sanctum)/ {
        root /var/www/cyf/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/cyf/backend/public$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 180;
            fastcgi_read_timeout 180;
        }
    }

    # -------------------------------------------------------------
    # SvelteKit SSR Frontend (Node.js Adapter-Node)
    # -------------------------------------------------------------
    location / {
        try_files $uri @sveltekit;
    }

    location @sveltekit {
        proxy_pass http://sveltekit_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Deny access to hidden files (.env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
