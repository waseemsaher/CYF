; Production PHP-FPM Pool Configuration for CYF
; Place in /etc/php/8.3/fpm/pool.d/www.conf

[www]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management (optimized for 2GB-4GB RAM Droplet)
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 1000

; Request Timeout
request_terminate_timeout = 180s

; Clear environment variables for security, pass system PATH
clear_env = no

; Health check ping
ping.path = /fpm-ping
ping.response = pong
