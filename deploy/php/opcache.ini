; Production OPcache configuration for PHP 8.3
; Place in /etc/php/8.3/mods-available/opcache.ini (or /usr/local/etc/php/conf.d/opcache.ini)

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1

; JIT Configuration
opcache.jit=tracing
opcache.jit_buffer_size=64M

; Upload & Execution limits matching platform requirements
upload_max_filesize=55M
post_max_size=55M
memory_limit=256M
max_execution_time=90
max_input_time=90
