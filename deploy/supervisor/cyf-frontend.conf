; Production Supervisor Configuration for SvelteKit Node SSR Server
; Place in /etc/supervisor/conf.d/cyf-frontend.conf

[program:cyf-frontend]
command=node build/index.js
directory=/var/www/cyf/frontend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cyf-frontend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=NODE_ENV="production",PORT="3000",HOST="127.0.0.1",ORIGIN="https://courses.fcai-azhar.edu.eg"
stopwaitsecs=15
