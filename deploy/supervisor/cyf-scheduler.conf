; Production Supervisor Configuration for Laravel Scheduler
; Place in /etc/supervisor/conf.d/cyf-scheduler.conf

[program:cyf-scheduler]
process_name=%(program_name)s
command=php /var/www/cyf/backend/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cyf-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=60
