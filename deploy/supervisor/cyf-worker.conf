; Production Supervisor Configuration for Laravel Queue Workers
; Place in /etc/supervisor/conf.d/cyf-worker.conf

[program:cyf-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/cyf/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cyf-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=95
