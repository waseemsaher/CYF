version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyf-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - '8000:8000'
    depends_on:
      - mysql
      - redis
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cyf
      DB_USERNAME: cyf
      DB_PASSWORD: secret
      REDIS_HOST: redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyf-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      HOST: 0.0.0.0
      PORT: 5173
    command: npm run dev -- --host 0.0.0.0 --port 5173

  mysql:
    image: mysql:8.4
    container_name: cyf-mysql
    environment:
      MYSQL_DATABASE: cyf
      MYSQL_USER: cyf
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: cyf-redis
    ports:
      - '6379:6379'

volumes:
  mysql-data:
